[mcp_servers.flet]
command = "uv"
args = [
    "--directory",
    ".",
    "run",
    "flet",
    "mcp"
]

[mcp_servers.flet.env]
FLET_MCP_ENABLE_EXAMPLES = "1"
FLET_MCP_ENABLE_CLI = "1"

[mcp_servers.flet.tools.find_icon]
approval_mode = "approve"

[mcp_servers.flet.tools.search_examples]
approval_mode = "approve"

[mcp_servers.flet.tools.get_cli_help]
approval_mode = "approve"
